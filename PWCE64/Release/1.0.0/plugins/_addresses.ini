# Библиотека адресов PWCE64 для клиента Perfect World 1.7.6 (Build 4311, RU).
#
# Бинарник: element/x64/elementclient_64.exe (PE32+ x86-64, без символов, база образа 0x140000000)
#   размер  26675560 байт
#   SHA-256 D51E1A95A7D19E9C1A9EAEF8785319E235FDF6822E7293AFDC1F4095C5CD391F
#
# Формат строки:
#   <имя> = 0xАДРЕС   ; сигнатура
# Адрес — виртуальный адрес при базе образа 0x140000000 (как в выводе objdump).
# Загрузчик пересчитывает его на фактическую базу модуля.
# Имена присвоены вручную: в exe нет символов.
# Строки, начинающиеся с '#' или ';', игнорируются.

SendFactionOP50 = 0x140c21280 ; (void* session, int id); sends FactionOPRequest (protocol 0x12c4) with optype 50, no return value
NotifyFactionOP50 = 0x1407c4330 ; (void* object, int id); ignores object, calls SendFactionOP50 with the current session
CDlgSkillSubOther::OnShowDialog = 0x140629c70 ; (void* self); refreshes the page and calls NotifyFactionOP50 with 3
