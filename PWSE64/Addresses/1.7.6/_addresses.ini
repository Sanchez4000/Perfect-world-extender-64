# Библиотека адресов PWSE64 для игрового сервера Perfect World 1.7.6.
#
# Бинарник: gamed/gs (ELF64 PIE x86-64, с символами и DWARF)
#   размер  364497864 байт
#   SHA-256 9EA0EE40DF3096FD1498283DCD30D6A7980BA6BAB3DC952A261AC17A8085E7D1
#
# Формат строки:
#   <имя> = 0xАДРЕС   ; сигнатура
# Адрес — виртуальный адрес из ELF (как в выводе nm). gs собран как PIE,
# загрузчик прибавляет к адресу базу загрузки.
# Имя — имя функции без списка аргументов (как в nm -C).
# Строки, начинающиеся с '#' или ';', игнорируются.

